rule_files:
  - rules/kaviont.yml

evaluation_interval: 30s
fuzzy_compare: true
group_eval_order:
  - kaviont-recording-rules
  - kaviont-alert-rules

tests:
  - name: sustained HTTP 5xx traffic records the error ratio and fires an alert
    interval: 30s
    input_series:
      - series: 'kaviont_http_server_duration_milliseconds_count{http_status_code="200", http_target="/ok"}'
        values: '0+60x16'
      - series: 'kaviont_http_server_duration_milliseconds_count{http_status_code="500", http_target="/__test__/error"}'
        values: '0+20x16'

    promql_expr_test:
      - expr: kaviont:http_requests:rate5m
        eval_time: 8m
        exp_samples:
          - labels: 'kaviont:http_requests:rate5m'
            value: 2.6666666667

      - expr: kaviont:http_errors:ratio5m
        eval_time: 8m
        exp_samples:
          - labels: 'kaviont:http_errors:ratio5m'
            value: 0.25

    alert_rule_test:
      - eval_time: 8m
        alertname: KaviontAPIHighErrorRate
        exp_alerts:
          - exp_labels:
              service: hello-api
              severity: warning
            exp_annotations:
              summary: "Kaviont API 5xx ratio is above 5%"
              description: "More than 5% of API requests returned HTTP 5xx responses over five minutes."
