apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: kaviont-local
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Local-only project for the Kaviont kind development cluster.
  sourceRepos:
    - https://github.com/mohamadjaafri/kaviont-platform.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: kaviont-local
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: apps
      kind: Deployment
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
    - group: autoscaling
      kind: HorizontalPodAutoscaler
    - group: policy
      kind: PodDisruptionBudget
    - group: networking.k8s.io
      kind: NetworkPolicy
  orphanedResources:
    warn: true
