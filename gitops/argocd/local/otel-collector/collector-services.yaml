apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: kaviont-local
  labels:
    app.kubernetes.io/name: otel-collector
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector-metrics
  namespace: kaviont-local
  labels:
    app.kubernetes.io/name: otel-collector
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: otel-collector
  ports:
    - name: prometheus-metrics
      port: 8889
      targetPort: metrics
      nodePort: 30089
      protocol: TCP
