apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: kaviont-local
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: kaviont-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-collector
        app.kubernetes.io/part-of: kaviont-platform
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.120.0
          args:
            - --config=/conf/collector-config.yaml
          env:
            - name: TEMPO_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: otel-collector-runtime
                  key: tempo_otlp_endpoint
          ports:
            - name: otlp-grpc
              containerPort: 4317
              protocol: TCP
            - name: metrics
              containerPort: 8889
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /conf
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
        - name: tmp
          emptyDir: {}
