apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello-api-local
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: kaviont-local
  source:
    repoURL: https://github.com/mohamadjaafri/kaviont-platform.git
    targetRevision: main
    path: charts/hello-api
    helm:
      valueFiles:
        - values-local.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: kaviont-local
  revisionHistoryLimit: 3
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
