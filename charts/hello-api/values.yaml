replicaCount: 2

image:
  repository: ghcr.io/example/hello-api
  tag: "0.9.0"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: hello-api

workloadIdentity:
  enabled: false
  clientId: ""
  keyVaultUrl: ""
  secretName: platform-demo-token

telemetry:
  enabled: false
  serviceName: hello-api
  otlpEndpoint: ""

marketData:
  enabled: false
  pollIntervalSeconds: 60
  pair: XBTUSD
  databaseUrlSecretName: market-data-database
  databaseUrlSecretKey: DATABASE_URL
  worker:
    enabled: false
    otlpEndpoint: ""
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 128Mi

# Optional local-only test fixture. The Secret must be created out of band.
localSecret:
  enabled: false
  secretName: ""
  secretKey: demo-secret

service:
  type: ClusterIP
  port: 80
  targetPort: 8080
  nodePort: null

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true
