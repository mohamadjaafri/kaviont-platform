# Local-only profile. The demo secret is created in the kind cluster by local-up.sh.
environment: local
replicaCount: 1

telemetry:
  enabled: true
  serviceName: hello-api-kubernetes
  otlpEndpoint: http://otel-collector.kaviont-local.svc.cluster.local:4317

image:
  repository: kaviont/hello-api
  tag: local
  pullPolicy: Never

serviceAccount:
  create: true
  name: hello-api-local

workloadIdentity:
  enabled: false
  clientId: ""
  keyVaultUrl: ""
  secretName: platform-demo-token

platformInsights:
  github:
    enabled: false
    tokenSecretName: github-read-token
    tokenSecretKey: token
  kubernetes:
    enabled: true

marketData:
  enabled: false
  pollIntervalSeconds: 60
  pair: XBTUSD
  databaseUrlSecretName: market-data-database
  databaseUrlSecretKey: DATABASE_URL
  worker:
    enabled: false

localSecret:
  enabled: true
  secretName: hello-api-local
  secretKey: demo-secret

service:
  type: NodePort
  port: 80
  targetPort: 8080
  nodePort: 30081

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: false
  minAvailable: 1

# kind's default CNI does not enforce NetworkPolicy. Keep the local profile explicit.
networkPolicy:
  enabled: false
