apiVersion: v1
kind: Service
metadata:
  name: {{ include "hello-api.fullname" . }}
  labels:
    {{- include "hello-api.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      {{- if eq .Values.service.type "NodePort" }}
      nodePort: {{ required "service.nodePort is required for NodePort services" .Values.service.nodePort }}
      {{- end }}
  selector:
    app.kubernetes.io/name: {{ include "hello-api.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
