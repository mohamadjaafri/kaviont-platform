{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "hello-api.serviceAccountName" . }}
  labels:
    {{- include "hello-api.labels" . | nindent 4 }}
  {{- if .Values.workloadIdentity.enabled }}
  annotations:
    azure.workload.identity/client-id: {{ required "workloadIdentity.clientId is required when workload identity is enabled" .Values.workloadIdentity.clientId | quote }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
