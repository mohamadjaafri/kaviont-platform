{{- if .Values.platformInsights.kubernetes.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "hello-api.fullname" . }}-engineering-read
  labels:
    {{- include "hello-api.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "hello-api.fullname" . }}-engineering-read
  labels:
    {{- include "hello-api.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "hello-api.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "hello-api.fullname" . }}-engineering-read
{{- end }}
