name: kaviont

services:
  hello-api:
    profiles: ["dev", "observability"]
    image: kaviont/hello-api:local
    build:
      context: ./workloads/hello-api
      dockerfile: Dockerfile
      target: runtime
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --reload
    environment:
      KEY_VAULT_URL: ""
      KEY_VAULT_SECRET_NAME: platform-demo-token
      LOCAL_DEMO_SECRET: ${LOCAL_DEMO_SECRET:-}
      KAVIONT_ENV: local
      KAVIONT_GITHUB_TOKEN: ${KAVIONT_GITHUB_TOKEN:-}
      DATABASE_URL: postgresql://kaviont:${POSTGRES_PASSWORD:-kaviont-local-only}@postgres:5432/kaviont
      KRAKEN_POLL_INTERVAL_SECONDS: ${KRAKEN_POLL_INTERVAL_SECONDS:-60}
      KRAKEN_MARKET_PAIR: ${KRAKEN_MARKET_PAIR:-XBTUSD}
      OTEL_SERVICE_NAME: hello-api
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_INSECURE: "true"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - type: bind
        source: ./workloads/hello-api/app
        target: /app/app
        read_only: true
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/readyz', timeout=2)"
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

  market-data-worker:
    profiles: ["dev", "observability"]
    image: kaviont/market-data-worker:local
    build:
      context: ./workloads/hello-api
      dockerfile: Dockerfile
      target: runtime
    command: ["python", "-m", "app.market_worker"]
    environment:
      DATABASE_URL: postgresql://kaviont:${POSTGRES_PASSWORD:-kaviont-local-only}@postgres:5432/kaviont
      KAVIONT_ENV: local
      KRAKEN_POLL_INTERVAL_SECONDS: ${KRAKEN_POLL_INTERVAL_SECONDS:-60}
      KRAKEN_MARKET_PAIR: ${KRAKEN_MARKET_PAIR:-XBTUSD}
      OTEL_SERVICE_NAME: market-data-worker
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_INSECURE: "true"
    volumes:
      - type: bind
        source: ./workloads/hello-api/app
        target: /app/app
        read_only: true
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  postgres:
    profiles: ["dev", "observability"]
    image: postgres:17.5-alpine
    environment:
      POSTGRES_USER: kaviont
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kaviont-local-only}
      POSTGRES_DB: kaviont
    volumes:
      - market-data-db:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaviont -d kaviont"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  adminer:
    profiles: ["observability"]
    image: adminer:6.3.0-standalone
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "127.0.0.1:8085:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres-exporter-bootstrap:
    profiles: ["observability"]
    image: postgres:17.5-alpine
    entrypoint: ["/bin/sh", "/scripts/bootstrap-postgres-exporter-role.sh"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-kaviont}
      PGPASSWORD: ${POSTGRES_PASSWORD:-kaviont-local-only}
      PGDATABASE: postgres
      POSTGRES_EXPORTER_PASSWORD: ${POSTGRES_EXPORTER_PASSWORD:-kaviont-exporter-local-only}
    volumes:
      - ./scripts/bootstrap-postgres-exporter-role.sh:/scripts/bootstrap-postgres-exporter-role.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres-exporter:
    profiles: ["observability"]
    image: prometheuscommunity/postgres-exporter:v0.20.1
    environment:
      DATA_SOURCE_URI: postgres:5432/postgres?sslmode=disable
      DATA_SOURCE_USER: postgres_exporter
      DATA_SOURCE_PASS: ${POSTGRES_EXPORTER_PASSWORD:-kaviont-exporter-local-only}
    expose:
      - "9187"
    depends_on:
      postgres-exporter-bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped

  hello-api-test:
    profiles: ["test"]
    image: kaviont/hello-api:test
    build:
      context: ./workloads/hello-api
      dockerfile: Dockerfile
      target: test
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  otel-collector:
    profiles: ["observability"]
    image: otel/opentelemetry-collector-contrib:0.120.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    depends_on:
      - tempo
    restart: unless-stopped

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./observability/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - ./observability/rules:/etc/prometheus/rules:ro
      - ./.runtime/prometheus-targets:/prometheus-targets:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - hello-api
      - blackbox-exporter
      - alertmanager
    restart: unless-stopped

  blackbox-exporter:
    profiles: ["observability"]
    image: prom/blackbox-exporter:v0.29.1
    command:
      - --config.file=/etc/blackbox/blackbox.yaml
    volumes:
      - ./observability/blackbox.yaml:/etc/blackbox/blackbox.yaml:ro
    ports:
      - "127.0.0.1:9115:9115"
    restart: unless-stopped

  tempo:
    profiles: ["observability"]
    image: grafana/tempo:2.7.2
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "127.0.0.1:3200:3200"
    restart: unless-stopped

  alertmanager:
    profiles: ["observability"]
    image: prom/alertmanager:v0.35.0
    command:
      - --config.file=/etc/alertmanager/alertmanager.yaml
      - --storage.path=/alertmanager
    volumes:
      - ./observability/alertmanager.yaml:/etc/alertmanager/alertmanager.yaml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    depends_on:
      - mailpit
    restart: unless-stopped

  mailpit:
    profiles: ["observability"]
    image: axllent/mailpit:v1.27.4
    expose:
      - "1025"
    ports:
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
      - tempo
      - alertmanager
    restart: unless-stopped

volumes:
  market-data-db:
  prometheus-data:
  tempo-data:
  grafana-data:
  alertmanager-data:
