name: Kaviont CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform format and validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.4
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -diff -recursive infrastructure/terraform

      - name: Initialize state bootstrap without backend
        working-directory: infrastructure/terraform/bootstrap/state
        run: terraform init -backend=false -input=false

      - name: Validate state bootstrap
        working-directory: infrastructure/terraform/bootstrap/state
        run: terraform validate

      - name: Initialize development environment without backend
        working-directory: infrastructure/terraform/environments/dev
        run: terraform init -backend=false -input=false

      - name: Validate development environment
        working-directory: infrastructure/terraform/environments/dev
        run: terraform validate

  application:
    name: API tests and container build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Compose profiles
        run: docker compose --profile dev --profile test config --quiet

      - name: Build and run tests inside the test image
        run: |
          docker buildx build --load --target test \
            --tag kaviont/hello-api:test \
            workloads/hello-api
          docker run --rm kaviont/hello-api:test

      - name: Build the runtime image
        run: |
          docker buildx build --load --target runtime \
            --tag kaviont/hello-api:${{ github.sha }} \
            workloads/hello-api

  helm:
    name: Helm chart validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Lint chart
        run: helm lint charts/hello-api

      - name: Render chart with Workload Identity enabled
        run: |
          helm template hello-api charts/hello-api --namespace demo \
            --set workloadIdentity.enabled=true \
            --set-string workloadIdentity.clientId=00000000-0000-0000-0000-000000000001 \
            --set-string workloadIdentity.keyVaultUrl=https://example.vault.azure.net/ >/tmp/kaviont-rendered.yaml
          grep -q 'azure.workload.identity/use: "true"' /tmp/kaviont-rendered.yaml
          grep -q 'azure.workload.identity/client-id:' /tmp/kaviont-rendered.yaml

  gitops:
    name: Argo CD GitOps validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Install YAML validation dependency
        run: python -m pip install "PyYAML>=6,<7"

      - name: Validate Argo CD project, application, and values contract
        run: python scripts/validate_gitops.py

      - name: Lint hello-api using GitOps values template
        run: helm lint charts/hello-api --values charts/hello-api/values-gitops.yaml.example

      - name: Render Azure GitOps workload
        run: |
          helm template hello-api charts/hello-api --namespace demo \
            --values charts/hello-api/values-gitops.yaml.example >/tmp/kaviont-gitops.yaml
          grep -q 'azure.workload.identity/use: "true"' /tmp/kaviont-gitops.yaml
          grep -q 'azure.workload.identity/client-id:' /tmp/kaviont-gitops.yaml
          grep -q 'REPLACE_WITH_ACR_LOGIN_SERVER/hello-api:0.2.0' /tmp/kaviont-gitops.yaml

      - name: Lint and render local profile
        run: |
          helm lint charts/hello-api --values charts/hello-api/values-local.yaml
          helm template hello-api-local charts/hello-api --namespace kaviont-local \
            --values charts/hello-api/values-local.yaml >/tmp/kaviont-local.yaml
          grep -q 'imagePullPolicy: Never' /tmp/kaviont-local.yaml
          grep -q 'name: LOCAL_DEMO_SECRET' /tmp/kaviont-local.yaml
          if grep -q 'azure.workload.identity/use' /tmp/kaviont-local.yaml; then
            echo "Local profile must not enable Azure Workload Identity." >&2
            exit 1
          fi
