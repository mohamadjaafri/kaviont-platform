name: Engineering Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    name: Repository security checks
    uses: ./.github/workflows/reusable-security.yml
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      run_dependency_check: \${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    secrets:
      NVD_API_KEY: \${{ secrets.NVD_API_KEY }}
