name: OWASP ZAP Baseline

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: HTTPS URL to an application you are authorized to test
        required: true
        type: string
      authorized_scope:
        description: Confirm that you own the target or have written authorization
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  validate_target:
    name: Validate explicit DAST target
    runs-on: ubuntu-latest
    steps:
      - name: Enforce HTTPS and exact host allowlist
        env:
          TARGET_URL: ${{ inputs.target_url }}
          AUTHORIZED_SCOPE: ${{ inputs.authorized_scope }}
          DAST_ALLOWED_HOSTS: ${{ vars.DAST_ALLOWED_HOSTS }}
        run: |
          python - <<'PY'
          import ipaddress
          import os
          import socket
          import sys
          from urllib.parse import urlparse

          if os.environ.get("AUTHORIZED_SCOPE", "").lower() != "true":
              sys.exit("Explicit authorization confirmation is required.")

          target = urlparse(os.environ["TARGET_URL"].strip())
          if target.scheme != "https" or not target.hostname:
              sys.exit("Only a valid HTTPS target is allowed.")
          if target.username or target.password:
              sys.exit("Credentials must not be embedded in the target URL.")
          if target.port not in (None, 443):
              sys.exit("Only the standard HTTPS port is allowed.")

          host = target.hostname.lower().rstrip(".")
          try:
              address = ipaddress.ip_address(host)
          except ValueError:
              address = None
          if address and (address.is_private or address.is_loopback or address.is_link_local or address.is_reserved):
              sys.exit("Private, loopback, link-local and reserved IP targets are blocked.")

          allowed = {
              value.strip().lower().rstrip(".")
              for value in os.environ.get("DAST_ALLOWED_HOSTS", "").split(",")
              if value.strip()
          }
          if not allowed or host not in allowed:
              sys.exit("Target host is not in the repository variable DAST_ALLOWED_HOSTS.")
          try:
              resolved = {
                  entry[4][0]
                  for entry in socket.getaddrinfo(host, 443, type=socket.SOCK_STREAM)
              }
          except OSError as error:
              sys.exit("Target host could not be resolved: " + str(error))

          if not resolved:
              sys.exit("Target host did not resolve to an address.")
          for resolved_address in resolved:
              address = ipaddress.ip_address(resolved_address)
              if not address.is_global:
                  sys.exit("Target host resolves to a non-public address.")
          print("Approved DAST host:", host)
          PY

  zap_baseline:
    name: OWASP ZAP passive baseline scan
    needs: validate_target
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Run ZAP baseline scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: ${{ inputs.target_url }}
          artifact_name: zap-baseline-report
          cmd_options: "-a"
